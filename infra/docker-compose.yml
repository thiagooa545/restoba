# ════════════════════════════════════════════════════════════════════
# PARA LA EXPOSICIÓN
#
# Levanta PostgreSQL con PostGIS en un contenedor.
#
# Por qué en contenedor y no instalado en cada máquina: los seis trabajamos
# contra exactamente la misma versión de PostgreSQL y de PostGIS. Nadie instala
# nada a mano y desaparece el clásico «en mi máquina anda».
#
# El documento exigía PostgreSQL + PostGIS desde el análisis (apartado 16); lo
# único que agregamos es la forma de instalarlo.
# ════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: restoba-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restoba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restoba_dev}
      POSTGRES_DB: ${POSTGRES_DB:-restoba}
      # La imagen solo trae el locale C.UTF-8, así que no se fuerza es_AR:
      # initdb entra en bucle de reinicio si el locale no existe.
      # La búsqueda sin acentos la resuelve la función normalizar() de la
      # migración 001 (unaccent + lower), no el collation.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - restoba_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restoba} -d ${POSTGRES_DB:-restoba}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  restoba_pgdata:
